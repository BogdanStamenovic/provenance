[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "provenance"
version = "0.1.0"
description = "Keep a recipe on the SSD for recreating everything on an untrusted disk."
readme = "README.md"
# tomllib (3.11) reads the config; nothing else outside the stdlib.
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bogdan Stamenovic" }]
keywords = ["provenance", "backup", "fanotify", "disk", "recipe", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10",
  "pytest-cov>=5.0,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<3",
]

[project.scripts]
provenance = "provenance.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/provenance"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
